[project]
name = "atlassian-mock"
version = "1.0.0"
description = "Mock Atlassian Rovo MCP server whose token endpoint redeems ID-JAGs (RFC 7523 jwt-bearer)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyjwt>=2.8",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Starlette nags about httpx in its TestClient; irrelevant here.
filterwarnings = ["ignore:Using `httpx` with"]
